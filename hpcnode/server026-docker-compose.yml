version: '3.1'

networks:
  computenet:
    driver: ipvlan
    driver_opts:
      parent: eth4
    ipam:
      config:
        - subnet: 10.152.222.0/23
          gateway: 10.152.222.1
          ip_range: 10.152.223.0/24
services:
  portainer-agent:
    container_name: portainer-agent
    image: portainer/agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - 9001:9001
    restart: always

  compute196:
    extends:
      file: compute-common-docker-compose.yml
      service: compute
    container_name: compute196
    hostname: compute196
    networks:
      computenet:
        ipv4_address: 10.152.223.196
    volumes:
      - /localdisk/tmp/compute196:/tmp:rw
      - /dev/null:/dev/nvidia1
      - /dev/null:/dev/nvidia2
      - /dev/null:/dev/nvidia3
    deploy:
      resources:
        limits:
          cpus: "48"
          memory: 150G
          pids: -1
    memswap_limit: 150G
    shm_size: 150G

  compute197:
    extends:
      file: compute-common-docker-compose.yml
      service: compute
    container_name: compute197
    hostname: compute197
