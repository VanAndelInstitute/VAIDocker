version: '3.1'

networks:
  extcomputenet:
    name: hpcnode_computenet
    external: true

services:
  compute153:
    extends:
      file: compute-common-docker-compose.yml
      service: compute
    container_name: compute153
    hostname: compute153
    networks:
      extcomputenet:
        ipv4_address: 10.152.223.153
    volumes:
      - /localdisk/tmp/compute153:/tmp:rw
      - /dev/null:/dev/nvidia1
      - /dev/null:/dev/nvidia2
      - /dev/null:/dev/nvidia3
    deploy:
      resources:
        limits:
          cpus: "10"
          memory: 150G
          pids: -1
    memswap_limit: 150G
    shm_size: 150G

  compute154:
