version: '3.1'

networks:
  computenet:
    driver: ipvlan
    driver_opts:
      parent: ens160
    ipam:
      config:
        - subnet: 10.152.222.0/23
          gateway: 10.152.222.1
          ip_range: 10.152.223.0/24

services:
  portainer-agent:
    container_name: portainer-agent
    image: portainer/agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - 9001:9001
    restart: always

  slurm:
    extends: 
      file: test-compute-common-docker-compose.yml
      service: compute
    container_name: slurmDev
    hostname: slurmDev
    networks: 
      computenet:
        ipv4_address: 10.152.223.224
    cpus: 4.0
  mysql:
    image: vanandelinstitute/mysqlslurm:20241211
    container_name: mysqlslurmDev
    hostname: mysqlslurmDev
    environment:
      MARIADB_ROOT_PASSWORD_HASH: "*097233137F449CDD6DCF0449FA11B5D189340B3B"
      MARIADB_DATABASE: slurm_acct_db
    networks: 
      computenet:
        ipv4_address: 10.152.223.225
    volumes:
      - /varidata/research/clustermgmt/vaihpc/slurmDev/var/lib/mysql:/var/lib/mysql 
      - /varidata/research/clustermgmt/vaihpc/slurmDev/etc/mysql/conf.d:/etc/mysql/conf.d 
  
